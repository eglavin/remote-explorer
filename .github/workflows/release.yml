name: Release

# Push a version tag to publish a release:
#   git tag v1.2.0 && git push origin v1.2.0
# Tags with a suffix, such as v1.2.0-rc.1, are published as pre-releases.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: go run ./scripts/build -version "$GITHUB_REF_NAME"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/remote-explorer-*

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          ## Install

          Download the binary for your platform below, or on Linux or macOS:

          \`\`\`bash
          curl -LO https://github.com/$REPO/releases/download/$TAG/remote-explorer-linux-amd64
          chmod +x remote-explorer-linux-amd64
          ./remote-explorer-linux-amd64 --version
          \`\`\`

          | Platform | File |
          |---|---|
          | Windows (x64 / ARM) | \`remote-explorer-windows-amd64.exe\` / \`remote-explorer-windows-arm64.exe\` |
          | macOS (Intel / Apple silicon) | \`remote-explorer-darwin-amd64\` / \`remote-explorer-darwin-arm64\` |
          | Linux (x64 / ARM) | \`remote-explorer-linux-amd64\` / \`remote-explorer-linux-arm64\` |

          On macOS, downloads from a browser are quarantined. Run \`xattr -d com.apple.quarantine <file>\` before the first start.

          Verify downloads against \`SHA256SUMS\`:

          \`\`\`bash
          sha256sum --ignore-missing -c SHA256SUMS
          \`\`\`

          Verify that a binary was built by this repository's release workflow:

          \`\`\`bash
          gh attestation verify remote-explorer-linux-amd64 --repo $REPO
          \`\`\`

          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # --generate-notes appends GitHub's list of changes to our notes.
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "remote-explorer $TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            "${prerelease[@]}"
